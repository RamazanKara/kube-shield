---
# Intentionally exposed secrets for e2e testing.
# DO NOT deploy to any real cluster.
# All secret values here are synthetic test data only.

# Secret to expose via environment variable (SEC-001)
apiVersion: v1
kind: Secret
metadata:
  name: e2e-db-credentials
  namespace: kube-shield-e2e
type: Opaque
data:
  username: dGVzdHVzZXI=
  password: dGVzdHBhc3N3b3Jk
---
# Empty secret (SEC-010)
apiVersion: v1
kind: Secret
metadata:
  name: e2e-empty-secret
  namespace: kube-shield-e2e
type: Opaque
data: {}
---
# Secret for envFrom (SEC-003)
apiVersion: v1
kind: Secret
metadata:
  name: e2e-app-config-secret
  namespace: kube-shield-e2e
type: Opaque
data:
  API_KEY: ZmFrZS1hcGkta2V5
  DB_URL: cG9zdGdyZXM6Ly9sb2NhbGhvc3QvdGVzdA==
---
# Pod exposing secrets as env vars (SEC-001, SEC-003)
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
  namespace: kube-shield-e2e
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "infinity"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: e2e-db-credentials
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: e2e-db-credentials
              key: password
        - name: MISSING_SECRET
          valueFrom:
            secretKeyRef:
              name: e2e-nonexistent-secret
              key: value
              optional: true
      envFrom:
        - secretRef:
            name: e2e-app-config-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
        requests:
          cpu: "50m"
          memory: "32Mi"
---
# Pod with secret at sensitive mount path (SEC-005) and permissive mode (SEC-004)
apiVersion: v1
kind: Pod
metadata:
  name: secret-mount-pod
  namespace: kube-shield-e2e
spec:
  volumes:
    - name: creds
      secret:
        secretName: e2e-db-credentials
        defaultMode: 0777
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: creds
          mountPath: /etc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
        requests:
          cpu: "50m"
          memory: "32Mi"
