name: Bug report
description: Report a reproducible problem in kube-shield.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Include commands, sanitized manifests, and expected versus actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kube-shield Version
      placeholder: "kube-shield version"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install Method
      options:
        - Homebrew cask
        - Go install
        - Docker image
        - Helm chart
        - GitHub release archive
        - Built from source
        - Other
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes Version
      placeholder: "kubectl version --short"
  - type: dropdown
    id: output
    attributes:
      label: Output Format
      options:
        - table
        - json
        - sarif
        - TUI dashboard
        - not applicable
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Output
      render: shell
