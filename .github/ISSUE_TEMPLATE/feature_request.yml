name: Feature request
description: Suggest a new capability or scanner improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What security or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should kube-shield do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner/check
        - CLI/config
        - TUI dashboard
        - Report output
        - Helm/Docker/release
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or alternatives considered?
