name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kube-shield-e2e
          config: test/e2e/testdata/kind-config.yaml
          wait: 120s

      - name: Wait for cluster readiness
        run: kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            /tmp/kube-shield-e2e-*.log
          retention-days: 7

      - name: Collect cluster state on failure
        if: failure()
        run: |
          echo "--- Pods ---"
          kubectl get pods -A
          echo "--- Events ---"
          kubectl get events -n kube-shield-e2e --sort-by='.lastTimestamp'
