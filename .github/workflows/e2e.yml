name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          [ -f /usr/local/bin/kind ] && exit 0
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-test-logs
          path: |
            /tmp/kube-shield-e2e-*.log
          retention-days: 7

      - name: Collect cluster state on failure
        if: failure()
        run: |
          echo "--- Pods ---"
          kubectl get pods -A
          echo "--- Events ---"
          kubectl get events -n kube-shield-e2e --sort-by='.lastTimestamp'
