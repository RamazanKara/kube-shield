version: 2

project_name: kube-shield

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: .
    binary: kube-shield
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/RamazanKara/kube-shield/pkg/version.Version={{.Version}}
      - -X github.com/RamazanKara/kube-shield/pkg/version.Commit={{.Commit}}
      - -X github.com/RamazanKara/kube-shield/pkg/version.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

dockers:
  - image_templates:
      - "ghcr.io/ramazankara/kube-shield:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile
  - image_templates:
      - "ghcr.io/ramazankara/kube-shield:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64
    dockerfile: Dockerfile

docker_manifests:
  - name_template: "ghcr.io/ramazankara/kube-shield:{{ .Version }}"
    image_templates:
      - "ghcr.io/ramazankara/kube-shield:{{ .Version }}-amd64"
      - "ghcr.io/ramazankara/kube-shield:{{ .Version }}-arm64"
  - name_template: "ghcr.io/ramazankara/kube-shield:latest"
    image_templates:
      - "ghcr.io/ramazankara/kube-shield:{{ .Version }}-amd64"
      - "ghcr.io/ramazankara/kube-shield:{{ .Version }}-arm64"


